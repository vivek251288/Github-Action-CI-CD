<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Task Management System</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<header>

    <h1>Task Management System</h1>

    <p>Spring Boot + PostgreSQL + AWS RDS</p>

</header>


<main>

    <!-- Dashboard -->

    <section class="dashboard">

        <div class="card">
            <h3>Total Tasks</h3>
            <span id="totalTasks">0</span>
        </div>

        <div class="card">
            <h3>Pending</h3>
            <span id="pendingTasks">0</span>
        </div>

        <div class="card">
            <h3>Completed</h3>
            <span id="completedTasks">0</span>
        </div>

    </section>


    <!-- Add Task -->

    <section class="form-section">

        <h2>Create Task</h2>

        <form id="taskForm">

            <input
                type="text"
                id="title"
                placeholder="Task title"
                required
            >

            <textarea
                id="description"
                placeholder="Task description"
            ></textarea>

            <select id="priority">

                <option value="LOW">
                    Low
                </option>

                <option value="MEDIUM" selected>
                    Medium
                </option>

                <option value="HIGH">
                    High
                </option>

            </select>

            <button type="submit">
                Add Task
            </button>

        </form>

    </section>


    <!-- Search -->

    <section class="search-section">

        <input
            type="text"
            id="searchInput"
            placeholder="Search task..."
        >

        <button onclick="searchTasks()">
            Search
        </button>

        <button onclick="loadTasks()">
            All Tasks
        </button>

    </section>


    <!-- Task Table -->

    <section>

        <h2>Tasks</h2>

        <table>

            <thead>

            <tr>

                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Action</th>

            </tr>

            </thead>

            <tbody id="taskTableBody">

            </tbody>

        </table>

    </section>

</main>


<script src="/js/app.js"></script>

</body>

</html>
