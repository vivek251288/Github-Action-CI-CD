# Docker CI/CD pipeline
name: Docker Build -> Push -> Deploy

on:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build Jar
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t vivekpandey10/docker-ci-cd:latest .

      - name: Push Image to Docker Hub
        run: |
          docker push vivekpandey10/docker-ci-cd:latest

      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker stop spring-boot-app || true
            docker rm spring-boot-app || true
            docker pull vivekpandey10/docker-ci-cd:latest
            docker run -d --name spring-boot-app -p 8182:8181 vivekpandey10/docker-ci-cd:latest
